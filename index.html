<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="企業展示ブースを巡るリアル謎解きゲーム">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MISSION">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>MISSION ESCAPE</title>
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite">
    <section class="boot-card">
      <p class="eyebrow">SYSTEM BOOT</p>
      <h1>MISSION ESCAPE</h1>
      <p>ゲームデータを読み込んでいます…</p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <template id="header-template">
    <header class="topbar">
      <div>
        <p class="eyebrow">MISSION ESCAPE</p>
        <div class="topbar-title" id="routeLabel">GAME CONTROL</div>
      </div>
      <button id="menuButton" class="icon-button" type="button" aria-label="メニュー">☰</button>
    </header>
  </template>

  <dialog id="menuDialog">
    <div class="dialog-card">
      <h2>MENU</h2>
      <button id="installButton" class="secondary-button" type="button" hidden>ホーム画面に追加</button>
      <button id="backHomeButton" class="secondary-button" type="button">ルート画面へ</button>
      <button id="resetButton" class="danger-button" type="button">進行状況をリセット</button>
      <button id="closeMenuButton" class="ghost-button" type="button">閉じる</button>
    </div>
  </dialog>

  <script src="./app.js" defer></script>
  <script src="./scanner.js" defer></script>
</body>
</html>
